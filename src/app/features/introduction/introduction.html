<app-animated-section>
  <section class="intro-section">

      <p class="quote-mark">&#8220;</p>

      <p class="quote-author">&mdash; {{ config().openingQuoteAuthor }}</p>

      <p>{{ config().introduction }}</p>
    </div>
  </section>
</app-animated-section>
