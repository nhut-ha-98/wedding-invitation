<app-animated-section>
  <section class="info-section">
    <div class="invitation-frame">
      <div class="info-card paper-grain">
        <p class="info-label">✦ THIỆP MỜI ✦</p>
        <h2 class="info-title">
          {{ config().couple.partner1 }}
          <span class="ampersand">&</span>
          {{ config().couple.partner2 }}
        </h2>
        <p class="info-subtitle">Trân trọng kính mời sự hiện diện của bạn</p>

        <div class="stitch-divider" aria-hidden="true"></div>

        <!-- Detail Cards -->
        <div class="detail-deck">
          <figure class="detail-note detail-note--date paper-grain">
            <span class="note-pin" aria-hidden="true">✦</span>
            <span class="note-label">Ngày</span>
            <span class="note-value note-value--gold">{{ config().date }}</span>
          </figure>

          <figure class="detail-note detail-note--time paper-grain">
            <span class="note-pin" aria-hidden="true">✦</span>
            <span class="note-label">Giờ</span>
            <span class="note-value note-value--gold">{{ config().time }}</span>
          </figure>

          <figure class="detail-note detail-note--venue paper-grain">
            <span class="note-pin" aria-hidden="true">✦</span>
            <span class="note-label">Địa điểm</span>
            <span class="note-value">Nhà hàng {{ config().venue.name }}</span>
            <span class="note-sub">{{ config().venue.address }}</span>
            <div class="note-map-action">
              <a class="map-btn" [href]="config().venue.mapUrl" target="_blank" rel="noopener noreferrer">
                <svg class="map-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                  stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z" />
                  <circle cx="12" cy="10" r="3" />
                </svg>
                <span>Xem Bản Đồ & Chỉ Đường</span>
              </a>
            </div>
          </figure>
        </div>

        <!-- Schedule -->
        <div class="info-schedule">
          <h3 class="info-schedule-title">Chương Trình</h3>
          <div class="program-card paper-grain">
            @for (event of config().schedule; track event.time; let idx = $index) {
            <div class="program-stub">
              <div class="program-time-wrap">
                <span class="program-time">{{ event.time }}</span>
              </div>
              <div class="program-line" aria-hidden="true">
                <span class="program-node"></span>
              </div>
              <span class="program-label">{{ event.label }}</span>
            </div>
            }
          </div>
        </div>
      </div>
    </div>
  </section>
</app-animated-section>
