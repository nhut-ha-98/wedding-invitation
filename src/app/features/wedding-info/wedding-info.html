<app-animated-section>
  <section class="info-section">
    <div class="torn-paper">
      <div class="info-card torn-paper__sheet">
        <h2 class="info-title">
          {{ config().couple.partner1 }}
          <span class="ampersand">&</span>
          {{ config().couple.partner2 }}
        </h2>
        <p class="info-subtitle">Trân trọng kính mời sự có mặt của bạn</p>

        <div class="info-details">
          <div class="detail-row">
            <span class="detail-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <rect x="3" y="4" width="18" height="18" rx="2" />
                <path d="M3 10h18" />
              </svg>
            </span>
            <div>
              <p class="detail-label">Thời gian</p>
              <p class="detail-value">{{ config().date }} lúc {{ config().time }}</p>
            </div>
          </div>

          <div class="detail-row">
            <span class="detail-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z" />
                <circle cx="12" cy="10" r="3" />
              </svg>
            </span>
            <div>
              <p class="detail-label">Địa Điểm</p>
              <p class="detail-value">Nhà hàng {{ config().venue.name }}</p>
              <p class="detail-sub">{{ config().venue.address }}</p>
            </div>
          </div>

        </div>

        <a class="map-btn" [href]="config().venue.mapUrl" target="_blank" rel="noopener noreferrer">
          Xem Bản Đồ
        </a>
      </div>
    </div>
  </section>
</app-animated-section>
