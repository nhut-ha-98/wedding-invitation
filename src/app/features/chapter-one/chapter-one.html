<app-animated-section>
  <section class="chapter-section">
    <p class="chapter-label">Chapter One &mdash; How We Met</p>
    <div class="photo-frame">
      <div class="photo-placeholder" role="img" [attr.aria-label]="config().chapterOne.photoAlt">
        <div class="photo-overlay"></div>
        <div class="photo-icon">
          <svg
            width="48"
            height="48"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
          >
            <rect x="3" y="3" width="18" height="18" rx="2" />
            <circle cx="8.5" cy="8.5" r="1.5" />
            <path d="M21 15l-5-5L5 21" />
          </svg>
        </div>
      </div>
    </div>
    <div class="chapter-body">
      <p>{{ config().chapterOne.narrative }}</p>
    </div>
  </section>
</app-animated-section>
