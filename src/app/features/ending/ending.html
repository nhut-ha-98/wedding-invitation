<app-animated-section>
  <section class="ending-section">
    <div class="ending-divider">
      <svg
        class="ending-ornament"
        width="26"
        height="26"
        viewBox="0 0 24 24"
        fill="none"
        stroke="#d4af37"
        stroke-width="1.2"
        aria-hidden="true"
      >
        <path d="M4 20 C 9 16, 13 11, 14 4" />
        <path d="M8 15 C 5 13, 4 9, 7 8 C 10 7, 12 10, 10 13 Z" />
        <path d="M11 11 C 13 9, 15 9, 17 10 C 19 11, 18 14, 15 14 C 14 13, 12 12, 11 11 Z" />
        <circle cx="14" cy="5" r="1.1" />
        <circle cx="10" cy="17.5" r="1.1" opacity="0.6" />
      </svg>
    </div>

    <div class="ending-quote-block">
      <p class="ending-quote" appHandwrite>&#8220;{{ config().closingQuote }}&#8221;</p>
      <p class="ending-author">&mdash; {{ config().closingQuoteAuthor }}</p>
    </div>

    <div class="close-cta">
      <p class="close-text">Thank you for being part of our story.</p>
      <button
        class="close-btn"
        (click)="onClose()"
        (keydown.enter)="onClose()"
        aria-label="Close the wedding invitation book"
      >
        Close Book
      </button>
    </div>

    <p class="footer-note">{{ config().couple.partner1 }} & {{ config().couple.partner2 }}</p>
  </section>
</app-animated-section>
