<section class="proposal-section" [class.reduced-motion]="reducedMotion()">
  <app-section-header title="Album" subtitle="Những khoảnh khắc được lưu giữ" />
  <div class="polaroid-grid" [attr.aria-busy]="busy()">
    @for (slot of slots(); track $index; let slotIndex = $index) {
      <div
        class="polaroid-slot"
        [attr.role]="!reducedMotion() && slot.length ? 'button' : null"
        [attr.tabindex]="!reducedMotion() && slot.length ? 0 : null"
        [attr.aria-label]="
          !reducedMotion() && slot.length
            ? 'Xem ảnh trong chồng ảnh ' +
              (slotIndex + 1) +
              ', ' +
              (shownCounts()[slotIndex] ?? 0) +
              ' / ' +
              slot.length
            : null
        "
        [attr.data-photo-count]="slot.length"
        [attr.data-slot]="slotIndex"
        (click)="activateSlot(slotIndex)"
        (keydown)="onSlotKeydown($event, slotIndex)"
      >
        @for (polaroid of slot; track polaroid.index) {
          <div
            appInstantPhoto
            class="polaroid paper-grain"
            [style.z-index]="polaroid.index + 1"
            [style.order]="polaroid.index"
            [attr.data-index]="polaroid.index"
            [attr.data-rotate]="polaroid.rotate"
            [attr.data-offset]="polaroid.offset"
          >
            <div class="polaroid-photo">
              <img
                [attr.data-src]="polaroid.imageUrl"
                [alt]="polaroid.alt"
                [loading]="reducedMotion() ? 'lazy' : 'eager'"
                decoding="async"
              />
              <span class="snapshot-flash" aria-hidden="true"></span>
              <span class="snapshot-shutter" aria-hidden="true"></span>
            </div>
            @if (polaroid.caption) {
              <p class="polaroid-caption">{{ polaroid.caption }}</p>
            }
          </div>
        }
      </div>
    }
  </div>
  <!-- <div class="proposal-story">
    <p appHandwrite>{{ config().proposalStory }}</p>
  </div> -->
</section>
