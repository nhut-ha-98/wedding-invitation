<app-animated-section>
  <section class="proposal-section">
    <app-section-header title="Album" subtitle="Những khoảnh khắc được lưu giữ" />
    <div class="polaroid-grid">
      @for (polaroid of polaroids(); track polaroid.alt; let i = $index) {
        <div
          class="polaroid paper-grain"
          [style.--rotate]="polaroid.rotate + 'deg'"
          [style.--top]="polaroid.top + 'px'"
          [style.--left]="polaroid.left + 'px'"
          [attr.data-rotate]="polaroid.rotate"
        >
          <div class="polaroid-photo">
            <img [src]="polaroid.imageUrl" [alt]="polaroid.alt" loading="lazy" decoding="async" />
          </div>
          @if (polaroid.caption) {
            <p class="polaroid-caption">{{ polaroid.caption }}</p>
          }
        </div>
      }
    </div>
    <div class="proposal-story">
      <p appHandwrite>{{ config().proposalStory }}</p>
    </div>
  </section>
</app-animated-section>
