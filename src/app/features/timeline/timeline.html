<app-animated-section>
  <section class="timeline-section">
    <div class="timeline-header">
      <div class="timeline-divider">
        <span class="timeline-divider-ornament">✦</span>
      </div>
      <h2 class="timeline-title">Our Journey</h2>
      <p class="timeline-subtitle">Moments that brought us here</p>
    </div>
    <div class="timeline-rail">
      <div class="timeline-line"></div>
      @for (event of config().timeline; track event.year; let idx = $index) {
        <div class="timeline-item">
          <div class="timeline-dot"></div>
          <div class="timeline-card-side">
            @if (event.image) {
              <div class="timeline-polaroid" [class.rotate-left]="idx % 2 === 0" [class.rotate-right]="idx % 2 !== 0">
                <img [src]="event.image" [alt]="event.title" loading="lazy" />
              </div>
            }
            <div class="timeline-card paper-grain">
              <span class="timeline-year">{{ event.year }}</span>
              <h3 class="timeline-event-title">{{ event.title }}</h3>
              <p class="timeline-desc">{{ event.description }}</p>
            </div>
          </div>
        </div>
      }
    </div>
  </section>
</app-animated-section>
