<div
  #bookContainer
  class="book-container"
  role="application"
  aria-label="Wedding invitation storybook cover"

  <div class="page cover-page" data-density="hard">
    <!-- SVG Filters for tactile papercut depth and fiber -->
    <svg class="svg-defs" width="0" height="0" aria-hidden="true">
      <defs>
        <!-- Soft warm drop shadow for layered paper cutout -->
        <filter id="paper-layer-shadow" x="-20%" y="-20%" width="140%" height="140%">
          <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#120803" flood-opacity="0.8" />
        </filter>
        <!-- Elevated shadow for foreground butterflies and embossed letters -->
        <filter id="paper-lift-shadow" x="-30%" y="-30%" width="160%" height="160%">
          <feDropShadow
            dx="0.5"
            dy="3.2"
            stdDeviation="3.0"
            flood-color="#0f0602"
            flood-opacity="0.82"
          />
        </filter>
        <!-- Subtle inset bevel for paper cuts -->
        <filter id="paper-emboss" x="-20%" y="-20%" width="140%" height="140%">
          <feGaussianBlur in="SourceAlpha" stdDeviation="1" result="blur" />
          <feOffset dx="0.5" dy="1" result="offset" />
          <feComposite in="SourceGraphic" in2="offset" operator="over" />
        </filter>
        <!-- Handcut micro-rough paper edge displacement filter -->
        <filter id="handcut-deckle" x="-5%" y="-5%" width="110%" height="110%">
          <feTurbulence
            type="fractalNoise"
            baseFrequency="0.08"
            numOctaves="3"
            result="roughNoise"
          />
          <feDisplacementMap
            in="SourceGraphic"
            in2="roughNoise"
            scale="1.4"
            xChannelSelector="R"
            yChannelSelector="G"
          />
        </filter>
      </defs>
    </svg>

    <div class="paper-fiber-overlay"></div>

          <path d="M0,0 C3,-2.4 6.5,-2.2 8,0 C6.5,2.2 3,2.4 0,0 Z" fill="#d9a566" />
          <!-- Center Gilded Core -->
          <circle cx="0" cy="0" r="2.0" fill="#faeedb" stroke="#5a2d10" stroke-width="0.5" />
          <circle cx="0" cy="0" r="0.9" fill="#381708" />
        </g>
      </svg>

      <!-- ─── MAIN TITLE: COUPLE NAMES (Visual Centerpiece) ─── -->
      <h1 class="main-wedding-title" aria-label="Nhut Ha and Hoa Ha Wedding">
        <span class="title-paper-letter name-first">{{ config().couple.partner2 }}</span>
        <div class="ampersand-separator" aria-hidden="true">
          <svg class="ampersand-flourish flourish-left" viewBox="0 0 46 12" fill="none">
            <path
              d="M44,6 C34,6 25,1 17,5 C11,8 6,6 1,6 C11,6 17,11 26,7 C33,4 39,6 44,6 Z"
              fill="#d8a364"
              opacity="0.88"
            />
            <circle cx="2" cy="6" r="1.3" fill="#faeedb" />
          </svg>
          <span class="title-ampersand">&amp;</span>
          <svg class="ampersand-flourish flourish-right" viewBox="0 0 46 12" fill="none">
            <path
              d="M2,6 C12,6 21,1 29,5 C35,8 40,6 45,6 C35,6 29,11 20,7 C13,4 7,6 2,6 Z"
              fill="#d8a364"

            <circle cx="44" cy="6" r="1.3" fill="#faeedb" />

        </div>
        <span class="title-paper-letter name-second">{{ config().couple.partner1 }}</span>
      </h1>

      <!-- Simple Botanical Bottom Divider (Dandelion Motif) -->
      <svg
        class="botanical-divider bottom-divider"
        viewBox="0 0 200 24"
        fill="none"
        aria-hidden="true"
      >
        <!-- Left Horizontal Line -->
        <line

          y1="12"
          x2="86"
          y2="12"
          stroke="#b98552"
          stroke-width="0.85"
          stroke-linecap="round"

        <circle cx="24" cy="12" r="1.2" fill="#d9a566" />
        <circle cx="55" cy="12" r="0.9" fill="#c49054" />

        <!-- Right Horizontal Line -->
        <line
          x1="126"
          y1="12"
          x2="176"
          y2="12"
          stroke="#b98552"
          stroke-width="0.85"
          stroke-linecap="round"
        />
        <circle cx="176" cy="12" r="1.2" fill="#d9a566" />
        <circle cx="150" cy="12" r="0.9" fill="#c49054" />

        <!-- Center Simple Dandelion -->
        <g class="dandelion-center">
          <!-- Gentle Slender Stem -->
          <path
            d="M98,23 C99,18 99.5,14 100,10.5"
            stroke="#683918"
            stroke-width="1.0"
            stroke-linecap="round"
          />

          <!-- Seed Core -->
          <circle cx="100" cy="10.5" r="1.5" fill="#3d1d0b" />

          <!-- Radiating Dandelion Seed Filaments -->
          <line x1="100" y1="10.5" x2="100" y2="3.5" stroke="#d5a56d" stroke-width="0.75" />
          <circle cx="100" cy="3.5" r="0.85" fill="#faeedb" />

          <line x1="100" y1="10.5" x2="93.5" y2="5" stroke="#d5a56d" stroke-width="0.75" />
          <circle cx="93.5" cy="5" r="0.85" fill="#faeedb" />

          <line x1="100" y1="10.5" x2="93" y2="10.5" stroke="#d5a56d" stroke-width="0.75" />
          <circle cx="93" cy="10.5" r="0.85" fill="#faeedb" />

          <line x1="100" y1="10.5" x2="94.5" y2="15.5" stroke="#d5a56d" stroke-width="0.75" />
          <circle cx="94.5" cy="15.5" r="0.85" fill="#faeedb" />

          <line x1="100" y1="10.5" x2="106.5" y2="5" stroke="#d5a56d" stroke-width="0.75" />
          <circle cx="106.5" cy="5" r="0.85" fill="#faeedb" />

          <line x1="100" y1="10.5" x2="107" y2="10.5" stroke="#d5a56d" stroke-width="0.75" />
          <circle cx="107" cy="10.5" r="0.85" fill="#faeedb" />

          <line x1="100" y1="10.5" x2="105.5" y2="15.5" stroke="#d5a56d" stroke-width="0.75" />
          <circle cx="105.5" cy="15.5" r="0.85" fill="#faeedb" />

          <!-- Intermediate Rays -->
          <line x1="100" y1="10.5" x2="96.5" y2="4" stroke="#bf8f58" stroke-width="0.6" />
          <circle cx="96.5" cy="4" r="0.65" fill="#edd1a8" />
          <line x1="100" y1="10.5" x2="103.5" y2="4" stroke="#bf8f58" stroke-width="0.6" />
          <circle cx="103.5" cy="4" r="0.65" fill="#edd1a8" />

          <!-- Drifting Dandelion Seeds -->
          <g transform="translate(112, 5.5) rotate(20)">
            <line x1="0" y1="0" x2="-3.5" y2="1.2" stroke="#a36e3b" stroke-width="0.55" />
            <circle cx="0" cy="0" r="0.8" fill="#faeedb" />
            <path d="M0,0 L1.8,-1.2 M0,0 L2,0 M0,0 L1.6,1.2" stroke="#ebd2ad" stroke-width="0.5" />

          <g transform="translate(120, 9.5) rotate(12)">
            <line x1="0" y1="0" x2="-3" y2="1" stroke="#a36e3b" stroke-width="0.55" />
            <circle cx="0" cy="0" r="0.7" fill="#faeedb" />
            <path d="M0,0 L1.6,-1 M0,0 L1.8,0 M0,0 L1.4,1" stroke="#ebd2ad" stroke-width="0.45" />
          </g>
        </g>
      </svg>

      <!-- Wedding Date (Refined Serif, Spaced) -->
      <div class="date-capsule">
        <p class="wedding-date">{{ formattedDate() }}</p>
      </div>
    </div>
  </div>

  <!-- Page 2: Inside Storybook Transition Page -->
  <div class="page transition-page" data-density="hard">

            <g transform="translate(155, 25) rotate(15)">
              <line x1="0" y1="0" x2="0" y2="-9" stroke="#5c4033" stroke-width="0.5" />

              <line x1="0" y1="-11" x2="-2.5" y2="-14" stroke="#5c4033" stroke-width="0.3" />
              <line x1="0" y1="-11" x2="2.5" y2="-14" stroke="#5c4033" stroke-width="0.3" />

          </g>
        </svg>
      </div>
    </div>
  </div>
</div>

<!-- Floating Ambient Canvas Particles -->
<canvas #particleCanvas class="particle-canvas" aria-hidden="true"></canvas>

<!-- Sound / Music Toggle Button -->
<button
  class="music-toggle-btn"
  (click)="toggleMusic(); $event.stopPropagation()"
  [class.playing]="isMusicPlaying()"
  aria-label="Toggle background music"
>
  <span class="music-icon" aria-hidden="true">&#9835;</span>
</button>

<!-- Tactile Papercut Tap to Open Prompt -->
@if (showTapPrompt()) {
  <button
    class="tap-prompt-container"
    (click)="openBook()"
    (keydown.enter)="openBook()"
    aria-label="Tap to Open the wedding invitation book"
  >
    <div class="tap-paper-badge">
      <span class="great-vibes tap-prompt-text">Chạm để mở</span>
      <span class="tap-prompt-sub">Tap to Open</span>
      <span class="tap-prompt-fleuron" aria-hidden="true">❦</span>
    </div>
  </button>
}
