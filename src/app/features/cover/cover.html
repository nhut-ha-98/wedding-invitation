<div
  #bookContainer
  class="book-container"
  role="application"
  aria-label="Wedding invitation book cover"
>
  <div class="page cover-page" data-density="hard">
    <div class="spine"></div>
    <div class="spine-line spine-line-1"></div>
    <div class="spine-line spine-line-2"></div>
    <div class="spine-line spine-line-3"></div>

    <div class="corner-filigree corner-tl"></div>
    <div class="corner-filigree corner-tr"></div>
    <div class="corner-filigree corner-bl"></div>
    <div class="corner-filigree corner-br"></div>

    <div class="frame-border"></div>

    <div class="cover-content">
      <h1 class="book-title">
        <span class="title-line">A NEW</span>
        <span class="title-line">CHAPTER</span>
      </h1>

      <svg class="divider-ornament-top" viewBox="0 0 100 20" fill="none" aria-hidden="true">
        <line x1="0" y1="10" x2="30" y2="10" stroke="#d4af37" stroke-width="0.8" opacity="0.5" />
        <circle
          cx="50"
          cy="10"
          r="3"
          fill="none"
          stroke="#d4af37"
          stroke-width="0.8"
          opacity="0.6"
        />
        <line x1="70" y1="10" x2="100" y2="10" stroke="#d4af37" stroke-width="0.8" opacity="0.5" />
      </svg>

      <div class="names-column">
        <span class="name-partner">{{ config().couple.partner1 }}</span>
        <span class="ampersand">&amp;</span>
        <span class="name-partner">{{ config().couple.partner2 }}</span>
      </div>

      <p class="wedding-date">{{ formattedDate() }}</p>

      <svg class="divider-ornament-bottom" viewBox="0 0 80 12" fill="none" aria-hidden="true">
        <circle cx="40" cy="6" r="1.5" fill="#d4af37" opacity="0.4" />
        <line x1="44" y1="6" x2="78" y2="6" stroke="#d4af37" stroke-width="0.5" opacity="0.3" />
        <line x1="2" y1="6" x2="36" y2="6" stroke="#d4af37" stroke-width="0.5" opacity="0.3" />
      </svg>
    </div>
  </div>
  <div class="page transition-page">
    <div class="transition-inner">
      <p class="great-vibes transition-text" appHandwrite>10 năm cho một câu chuyện...</p>
      <div class="dandelion">
        <svg viewBox="0 0 200 180" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M100 175 L100 75" stroke="#5c4033" stroke-width="1.5" stroke-linecap="round" />
          <path d="M100 130 Q75 120 65 105 Q75 115 100 120" fill="#5c4033" opacity="0.5" />
          <path d="M100 115 Q125 105 135 90 Q125 100 100 105" fill="#5c4033" opacity="0.5" />
          <g>
            <circle cx="100" cy="72" r="2" fill="#d4af37" />
            <line x1="100" y1="72" x2="100" y2="50" stroke="#d4af37" stroke-width="0.6" />
            <line x1="100" y1="72" x2="88" y2="52" stroke="#d4af37" stroke-width="0.6" />
            <line x1="100" y1="72" x2="112" y2="52" stroke="#d4af37" stroke-width="0.6" />
            <line x1="100" y1="72" x2="78" y2="58" stroke="#d4af37" stroke-width="0.6" />
            <line x1="100" y1="72" x2="122" y2="58" stroke="#d4af37" stroke-width="0.6" />
            <line x1="100" y1="72" x2="72" y2="68" stroke="#d4af37" stroke-width="0.6" />
            <line x1="100" y1="72" x2="128" y2="68" stroke="#d4af37" stroke-width="0.6" />
          </g>
          <g opacity="0.7">
            <g transform="translate(42, 30) rotate(-20)">
              <line x1="0" y1="0" x2="0" y2="-10" stroke="#5c4033" stroke-width="0.5" />
              <circle cx="0" cy="-12" r="0.8" fill="#d4af37" />
              <line x1="0" y1="-12" x2="-3" y2="-15" stroke="#5c4033" stroke-width="0.3" />
              <line x1="0" y1="-12" x2="3" y2="-15" stroke="#5c4033" stroke-width="0.3" />
              <line x1="0" y1="-12" x2="0" y2="-16" stroke="#5c4033" stroke-width="0.3" />
            </g>
            <g transform="translate(155, 25) rotate(15)">
              <line x1="0" y1="0" x2="0" y2="-9" stroke="#5c4033" stroke-width="0.5" />
              <circle cx="0" cy="-11" r="0.7" fill="#d4af37" />
              <line x1="0" y1="-11" x2="-2.5" y2="-14" stroke="#5c4033" stroke-width="0.3" />
              <line x1="0" y1="-11" x2="2.5" y2="-14" stroke="#5c4033" stroke-width="0.3" />
            </g>
            <g transform="translate(135, 50) rotate(10)">
              <line x1="0" y1="0" x2="0" y2="-8" stroke="#5c4033" stroke-width="0.5" />
              <circle cx="0" cy="-10" r="0.7" fill="#d4af37" />
              <line x1="0" y1="-10" x2="-2" y2="-13" stroke="#5c4033" stroke-width="0.3" />
              <line x1="0" y1="-10" x2="2" y2="-13" stroke="#5c4033" stroke-width="0.3" />
            </g>
            <g transform="translate(60, 18) rotate(-25)">
              <line x1="0" y1="0" x2="0" y2="-7" stroke="#5c4033" stroke-width="0.5" />
              <circle cx="0" cy="-9" r="0.6" fill="#d4af37" />
              <line x1="0" y1="-9" x2="-2" y2="-12" stroke="#5c4033" stroke-width="0.3" />
              <line x1="0" y1="-9" x2="2" y2="-12" stroke="#5c4033" stroke-width="0.3" />
            </g>
          </g>
        </svg>
      </div>
    </div>
  </div>
</div>

<canvas #particleCanvas class="particle-canvas"></canvas>

<button
  class="music-toggle-btn"
  (click)="toggleMusic(); $event.stopPropagation()"
  [class.playing]="isMusicPlaying()"
  aria-label="Toggle background music"
>
  <span class="music-icon">&#9835;</span>
</button>

@if (showTapPrompt()) {
  <button
    class="tap-prompt-container"
    (click)="openBook()"
    (keydown.enter)="openBook()"
    aria-label="Tap to Open the invitation book"
  >
    <span class="great-vibes tap-prompt-text">Tap to Open</span>
    <span class="tap-prompt-arrow">&#8964;</span>
  </button>
}
